# Secure Docker Compose Template
# All ports bind to 127.0.0.1 for Zero Trust architecture

version: '3.8'

services:
  app:
    image: your-image:latest
    container_name: ${PROJECT}-${SERVICE}
    restart: unless-stopped

    # IMPORTANT: Always bind to 127.0.0.1
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"

    environment:
      - NODE_ENV=production
      # Add your environment variables here

    volumes:
      - app-data:/data

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data:
    driver: local

networks:
  app-network:
    driver: bridge
